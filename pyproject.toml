[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "python-review-bot"
version = "0.1.0"
description = "AI Code Review Copilot for Python — RAG + agent workflow that fixes code to match user intent."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Your Name", email = "you@example.com" }]
keywords = ["ai", "llm", "rag", "langgraph", "python", "code-review", "agents"]

dependencies = [
    "openai>=1.40.0",
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "chromadb>=0.5.0",
    "sentence-transformers>=3.0.0",
    "rank-bm25>=0.2.2",
    "tiktoken>=0.7.0",
    "fastapi>=0.112.0",
    "uvicorn[standard]>=0.30.0",
    "typer>=0.12.0",
    "rich>=13.7.0",
    "streamlit>=1.37.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "libcst>=1.4.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "bandit>=1.7.9",
    "pytest>=8.2.0",
]

[project.optional-dependencies]
dev = ["pytest-cov>=5.0.0", "pytest-asyncio>=0.23.0", "pre-commit>=3.7.0", "hypothesis>=6.100.0"]

[project.scripts]
prb = "python_review_bot.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/python_review_bot"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = false

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
asyncio_mode = "auto"
